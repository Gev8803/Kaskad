<!DOCTYPE html>
<html lang="hy" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="assets/img/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <title>About Us — KASKAD GROUP</title>
  <meta name="description" content="Kaskad Group history, mission, vision, values, certificates and partners. 20+ years in power engineering and manufacturing." />
  <link rel="canonical" href="https://kaskadgroup.am/about.html" />
  <link rel="alternate" hreflang="hy" href="https://kaskadgroup.am/about.html?lang=hy" />
  <link rel="alternate" hreflang="ru" href="https://kaskadgroup.am/about.html?lang=ru" />
  <link rel="alternate" hreflang="en" href="https://kaskadgroup.am/about.html?lang=en" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+Armenian:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="about">
  <header id="site-header"></header>
  <main>
    <section class="hero hero--page">
      <div class="wrap hero__in">
        <p class="breadcrumbs"><a href="index.html" data-i18n="nav.home"></a> / <span data-i18n="nav.about"></span></p>
        <h1 class="hero__title" data-i18n="about.hero.title"></h1>
        <p class="hero__sub" data-i18n="about.hero.subtitle"></p>
      </div>
    </section>

    <section class="section section--darker">
      <div class="wrap"><div class="grid grid--4" data-render="stats"></div></div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="section__head"><span class="kicker" data-i18n="nav.about"></span><h2 class="section__title" data-i18n="about.history.title"></h2></div>
        <div data-render="history"></div>
      </div>
    </section>

    <section class="section section--tint">
      <div class="wrap split">
        <div class="mv">
          <div class="mv__card reveal"><h3 data-i18n="about.mission.title"></h3><p data-i18n="about.mission.text"></p></div>
          <div class="mv__card reveal" style="--d:100ms"><h3 data-i18n="about.vision.title"></h3><p data-i18n="about.vision.text"></p></div>
        </div>
        <div>
          <div class="section__head"><h2 class="section__title" data-i18n="about.values.title"></h2></div>
          <div class="grid grid--2" data-render="values"></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="section__head center"><span class="kicker" data-i18n="about.certs.title"></span><h2 class="section__title" data-i18n="about.certs.title"></h2></div>
        <div class="grid grid--3" data-render="certs"></div>
      </div>
    </section>

    <section class="section section--darker">
      <div class="wrap">
        <div class="section__head center"><h2 class="section__title" data-i18n="about.partners.title"></h2></div>
        <div class="logos" data-render="partners"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <button id="toTop" aria-label="Top"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <script src="assets/js/data.common.js"></script>
  <script src="assets/js/data.construction.js"></script>
  <script src="assets/js/data.switchgear.js"></script>
  <script src="assets/js/data.meters.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
