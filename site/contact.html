<!DOCTYPE html>
<html lang="hy" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="assets/img/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <title>Contact — KASKAD GROUP</title>
  <meta name="description" content="Contact Kaskad Group — Bagratunyats 54/3, Yerevan, Armenia. Phone +374 77 241 212." />
  <link rel="canonical" href="https://kaskadgroup.am/contact.html" />
  <link rel="alternate" hreflang="hy" href="https://kaskadgroup.am/contact.html?lang=hy" />
  <link rel="alternate" hreflang="ru" href="https://kaskadgroup.am/contact.html?lang=ru" />
  <link rel="alternate" hreflang="en" href="https://kaskadgroup.am/contact.html?lang=en" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+Armenian:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="contact">
  <header id="site-header"></header>
  <main>
    <section class="hero hero--page">
      <div class="wrap hero__in">
        <p class="breadcrumbs"><a href="index.html" data-i18n="nav.home"></a> / <span data-i18n="nav.contact"></span></p>
        <h1 class="hero__title" data-i18n="contact.hero.title"></h1>
        <p class="hero__sub" data-i18n="contact.hero.subtitle"></p>
      </div>
    </section>

    <section class="section">
      <div class="wrap contact__grid">
        <div>
          <div class="section__head"><span class="kicker" data-i18n="nav.contact"></span><h2 class="section__title" data-i18n="contact.info.title"></h2></div>
          <ul class="cinfo">
            <li><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span><b data-i18n="contact.address"></b><span data-render="topAddr"></span></span></li>
            <li><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4l2 5-3 2a12 12 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 2 6a2 2 0 0 1 2-2z"/></svg><span><b data-i18n="contact.phone"></b><a id="cPhone" href="#"></a></span></li>
            <li><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/></svg><span><b data-i18n="contact.email"></b><a id="cMail" href="#"></a></span></li>
          </ul>
        </div>
        <div>
          <div class="section__head"><h2 class="section__title" data-i18n="contact.form.title"></h2></div>
          <form class="form" id="contactForm" novalidate>
            <div class="row">
              <label data-i18n="contact.form.name"><input type="text" name="name" required data-i18n-ph="contact.form.name" /></label>
              <label data-i18n="contact.form.phone"><input type="tel" name="phone" data-i18n-ph="contact.form.phone" /></label>
            </div>
            <div class="row">
              <label data-i18n="contact.form.email"><input type="email" name="email" required data-i18n-ph="contact.form.email" /></label>
              <label data-i18n="contact.form.subject"><input type="text" name="subject" data-i18n-ph="contact.form.subject" /></label>
            </div>
            <label data-i18n="contact.form.message"><textarea name="message" required data-i18n-ph="contact.form.message"></textarea></label>
            <button class="btn btn--hot" type="submit" data-i18n="contact.form.submit"></button>
            <p class="form__msg" id="formMsg"></p>
          </form>
        </div>
      </div>
    </section>

    <section class="section section--tint" style="padding-top:0">
      <div class="wrap">
        <div class="section__head"><h2 class="section__title" data-i18n="contact.map.title"></h2></div>
        <iframe class="mapbox" title="Kaskad Group location" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps?q=Bagratunyats%2054%2F3%20Yerevan%20Armenia&output=embed"></iframe>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <button id="toTop" aria-label="Top"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <script src="assets/js/data.common.js"></script>
  <script src="assets/js/data.construction.js"></script>
  <script src="assets/js/data.switchgear.js"></script>
  <script src="assets/js/data.meters.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      var c = window.DATA.company.contact;
      var p = document.getElementById("cPhone"); if (p) { p.textContent = c.phone; p.href = "tel:" + c.phoneLink; }
      var m = document.getElementById("cMail"); if (m) { m.textContent = c.email; m.href = "mailto:" + c.email; }
    })();
  </script>
</body>
</html>
